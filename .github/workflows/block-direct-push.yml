name: Bloquear el envío directo a ramas protegidas

on:
  push:
    branches:
      - main
      - prod

jobs:
  block_push:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent direct push
        run: |
          echo "❌ Push directo a $GITHUB_REF no permitido. Usa Pull Request."
          exit 1
